# =============================================
# 密钥配置模板
# 复制此文件为 application-secret.yml 并填入真实值
# =============================================

spring:
  datasource:
    password: your-mysql-password

deepseek:
  api:
    key: sk-your-deepseek-key
    url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

jwt:
  secret: your-random-secret-at-least-256-bits
  access-expiration: 1800000
  refresh-expiration: 604800000
